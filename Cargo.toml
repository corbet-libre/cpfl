[package]
name = "cpfl"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/cpfl.git"
publish = false

[lib]
crate-type = ["rlib"]
# All behavior vectors are integration tests; there is no separate unit harness.
test = false

[dependencies]
cprz = { git = "https://git.corbet.ch/corbet-foss/cprz.git", branch = "main", default-features = false }
cprz-pad = { git = "https://git.corbet.ch/corbet-foss/cprz.git", branch = "main" }
cgrd = { git = "https://git.corbet.ch/corbet-foss/cgrd", branch = "main", default-features = false }
cshm = { git = "https://git.corbet.ch/corbet-foss/cshm", branch = "main" }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false }
cpns = { git = "https://git.corbet.ch/corbet-foss/cpns", branch = "main", default-features = false }
ckmg = { git = "https://git.corbet.ch/corbet-foss/ckmg.git", branch = "main", features = ["profile-envelope"] }
cnvl = { git = "https://git.corbet.ch/corbet-foss/cnvl.git", branch = "main" }
cwst = { git = "https://git.corbet.ch/corbet-foss/cwst.git", branch = "main" }
blake3 = "1"
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
zeroize = "1"

[dev-dependencies]
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }
futures-executor = "0.3"
cvch = { git = "https://git.corbet.ch/corbet-foss/cvch", branch = "main" }
wasm-bindgen-test = "0.3.79"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(owned_browser_coverage)"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
browser-coverage-runtime = { path = ".github/coverage-runtime" }
